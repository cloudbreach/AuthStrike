<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin · AuthStrike</title>
  <link rel="icon" href="{{ url_for('static', filename='AuthStrike.png') }}" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='operator.css') }}">
</head>
<body class="operator-body">
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 0%,#103456 0,transparent 34%),#070c14">
    <div style="width:100%;max-width:420px">
      <div class="login-brand">
        <div class="login-brand-image"><img src="{{ url_for('static', filename='AuthStrike-wordmark.png') }}" alt="AuthStrike — Identity Attack Simulation & Security Testing"></div>
      </div>
      <section class="card" style="box-shadow:0 22px 60px rgba(0,0,0,.34)">
        <div style="padding:24px 24px 6px">
          <div class="eyebrow">Admin access</div><h1 style="margin:0;font-size:24px">Sign in</h1><p style="color:#8fa0b6;font-size:12px;line-height:1.55;margin:7px 0 0">Access the authorized security testing workspace.</p>
        </div>
        <div class="card-body">
          {% if error %}<div class="notice error" style="margin-bottom:15px">{{ error }}</div>{% endif %}
          <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-field" style="margin-bottom:13px"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username" placeholder="Enter username" required autofocus></div>
            <div class="form-field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></div>
            <button class="button button-primary" style="width:100%;margin-top:18px;padding:11px" type="submit">Sign in</button>
          </form>
          <div class="page-footer-note">Authorized testing only. Treat access and authentication artifacts as sensitive.</div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
